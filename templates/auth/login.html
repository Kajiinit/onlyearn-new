{% extends "base.html" %}

{% block title %}
Login - OnlyEarn
{% endblock %}


{% block content %}

<section class="form-page">

   <div class="login-float login-book">
    <div class="book-shape"></div>
</div>

<div class="login-float login-money">
    <div class="money-card">$</div>
</div>

<div class="login-float login-laptop">
    <div class="laptop-screen"></div>
</div>

<div class="login-float login-chart">
    <div class="chart-box">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="login-float login-coin">
    <div class="coin-shape">$</div>
</div>

    <form class="panel form-panel" method="post">

        <h1>Login</h1>

        <label>Email
            <input 
                type="email" 
                name="email" 
                required 
                autocomplete="email">
        </label>


        <label>Password
            <input 
                type="password" 
                name="password" 
                required 
                autocomplete="current-password">
        </label>


        <div style="text-align:right; margin-bottom:15px;">
            <a href="{{ url_for('auth.forgot_password') }}">
                Forgot Password?
            </a>
        </div>


        <button class="button primary" type="submit">
            Login
        </button>

        <div class="auth-divider"><span>or continue with</span></div>
        <div class="social-login-options">
           <a class="social-login-button google" href="#">
    <span>G</span> Continue with Google
</a>

<a class="social-login-button apple" href="#">
    <span>●</span> Continue with Apple
</a>

        <p class="muted">
            New here?
            <a href="{{ url_for('auth.register') }}">
                Create an account
            </a>
        </p>

    </form>

</section>

{% endblock %}
