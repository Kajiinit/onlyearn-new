{% extends "base.html" %}

{% block title %}
Forgot Password - OnlyEarn
{% endblock %}


{% block content %}

<section class="form-page">

    <form class="panel form-panel" method="post">

        <h1>Forgot Password</h1>

        <p class="muted">
            Enter your email address and we will send you a password reset code.
        </p>

        <label>
            Email

            <input
                type="email"
                name="email"
                required
                autocomplete="email">
        </label>


        <button class="button primary" type="submit">
            Send Reset Code
        </button>


        <p class="muted">
            Remember your password?

            <a href="{{ url_for('auth.login') }}">
                Login
            </a>
        </p>

    </form>

    

</section>



{% endblock %}
