<!DOCTYPE html>
<html>
<head>
    <title>OnlyPostJob</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav>
    <h1>OnlyEarn</h1>
    <a href="/dashboard">Dashboard</a>
</nav>

<section class="hero">

    <h2>Post OnlyJob</h2>

    <form method="POST">

        <input name="title" placeholder="Job Title" required>
        <br><br>

        <input name="description" placeholder="Job Description" required>
        <br><br>

        <input name="budget" placeholder="Budget (e.g. $50)" required>
        <br><br>

        <button type="submit">Post Job</button>

    </form>

</section>

</body>
</html>
