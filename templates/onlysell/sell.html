{% extends "base.html" %}
{% block title %}Create Product - OnlyEarn{% endblock %}
{% block content %}
<section class="form-page">
    <form class="panel form-panel wide" method="post" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <h1>Create product listing</h1>
        <label>Title
            <input type="text" name="title" required>
        </label>
        <label>Description
            <textarea name="description" rows="6" required></textarea>
        </label>
        <div class="two-col">
            <label>Price
                <input type="text" name="price" required placeholder="120">
            </label>
            <label>Category
                <input type="text" name="category" required placeholder="Electronics">
            </label>
        </div>
        <label>Image
            <input type="file" name="image" accept=".png,.jpg,.jpeg,.gif,.webp">
        </label>
        <label class="check-row">
            <input type="checkbox" name="allow_negotiation" checked>
            <span>Allow buyers to message me and negotiate this product</span>
        </label>
        <button class="button primary" type="submit">Publish listing</button>
    </form>
</section>
{% endblock %}
